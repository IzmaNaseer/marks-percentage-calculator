<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator</title>
<style>
    .calculator {
    width: 90%;
    max-width: 500px;
    margin: 0 auto;
    box-sizing: border-box;
}
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #9b7ce377;
       
    }
    .box{
        width: 300px;
        margin: 0 auto;
        padding: 20px;
        border: 3px solid #9385c685;
        border-radius: 5px;
        background-color: #fcfafa;
    }
    h1 {
        color: #0e0d0d;
        white-space: nowrap;
        text-align: center;
    }

    label {
        font-weight: bold;
      }

    input[type="number"] {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        box-sizing: border-box;
       
    }

    button {
        background-color: #763ff6;
        color: white;
        font-weight: bold;
        padding: 10px 30px;
        border:#121010;
        border-width: 3px;
        cursor: pointer;
        margin-left:60px;
        border-radius: 5px;
    
    }

    button:hover {
        background-color: #6736d2;
    }

   p {
    margin-top: 20px;
    margin: right 300px;
     text-align: center;
    font-size: 20px;
    color: #333;
}
    #result {
    font-size: 18px;
    font-weight: bold;
    .perbox{
       background-color: #b8a4f3;
       border: 2px solid #0a0a0b85;
    }
}
</style>
</head>
<body>
    <div class="calculator">
    <h1>Marks Percentage Calculator</h1>
    <p>Calculate your marks percentage quickly and easily.</p>
   
<div class="box">
       <div class="first">

    <label>Obtain Marks</label><br>
    <input type="number" id="obtained">
</div><br>

<div class="second">
    <label>Total Marks</label><br>
     <input type="number"   id="total">
</div><br>

 <button id="calculate">Calculate Percentage</button>
 <p id="result"></p>
 </div>
</body>


<script>
const obtained = document.getElementById("obtained");
const total = document.getElementById("total");
const button = document.getElementById("calculate");

button.addEventListener("click", function() {
    let obtainedMarks = Number(obtained.value);
    let totalMarks = Number(total.value);

    if (totalMarks <= 0 || obtained.value === "" || total.value === "") {
        alert("Please enter valid marks.");
        return;
    }
     if (obtainedMarks > totalMarks) {
    result.textContent = "Invalid marks!";
    return;
}

    let percentage = (obtainedMarks / totalMarks) * 100;

    document.getElementById("result").textContent =
        "Your percentage is " + percentage + "%";
});
</script>

</html>
